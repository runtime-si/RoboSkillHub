<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" width="1600" height="860" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .h { font-weight: 700; fill: #1F2933; }
      .s { fill: #52606D; }
      .q { fill: #7B8794; }
      .m { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
      .card { fill: #FFFFFF; stroke: #E4E7EB; }
      .panel { fill: #F8FAFC; stroke: #E4E7EB; }
      .chip { fill: #F3F5F7; }
      .flow { fill: none; stroke: #52606D; stroke-width: 1.6; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 1.6px; fill: #7B8794; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#52606D"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#B83232"/>
    </marker>
    <clipPath id="cardclip"><rect width="288" height="234" rx="12"/></clipPath>
    <symbol id="arm" viewBox="0 0 120 110">
      <rect x="18" y="96" width="54" height="10" rx="3" fill="#7B8794"/>
      <line x1="45" y1="92" x2="58" y2="46" stroke="#52606D" stroke-width="10" stroke-linecap="round"/>
      <line x1="58" y1="46" x2="96" y2="56" stroke="#52606D" stroke-width="8" stroke-linecap="round"/>
      <circle cx="45" cy="92" r="8" fill="#3E4C59"/>
      <circle cx="58" cy="46" r="7" fill="#3E4C59"/>
      <line x1="96" y1="56" x2="96" y2="68" stroke="#52606D" stroke-width="5" stroke-linecap="round"/>
      <path d="M88,68 H104 M89,68 V80 M103,68 V80" stroke="#52606D" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <rect x="91" y="92" width="10" height="10" rx="1.5" fill="#D64545"/>
    </symbol>
  </defs>

  <rect width="1600" height="860" fill="#FFFFFF"/>

  <text x="48" y="62" font-size="32" class="h">Robot Skill Library</text>
  <text x="48" y="94" font-size="16.5" class="s">Ready-made building blocks for robot policies. Pick what fits your robot, compose a graph, run it.</text>

  <!-- ===================== what's inside ===================== -->
  <text x="48" y="140" class="label">WHAT&#8217;S INSIDE</text>

  <g transform="translate(48,156)">
    <rect width="288" height="234" rx="12" class="card"/>
    <rect width="288" height="5" fill="#2F6FB7" clip-path="url(#cardclip)"/>
    <rect x="20" y="22" width="38" height="38" rx="10" fill="#EAF2FB"/>
    <g transform="translate(21,23)" fill="none" stroke="#2F6FB7" stroke-width="2.2" stroke-linecap="round">
      <circle cx="18" cy="18" r="8"/>
      <path d="M18,5 V11 M18,25 V31 M5,18 H11 M25,18 H31"/>
      <circle cx="18" cy="18" r="1.8" fill="#2F6FB7" stroke="none"/>
    </g>
    <text x="70" y="49" font-size="21" font-weight="700" fill="#24598F">Tools</text>
    <text x="20" y="90" font-size="13.5" class="s">Models and solvers skills call:</text>
    <text x="20" y="109" font-size="13.5" class="s">detect, segment, plan motion.</text>
    <g font-size="11.5" class="m" fill="#1F2933">
      <rect x="20" y="146" width="48" height="22" rx="6" class="chip"/><text x="30" y="161">sam3</text>
      <rect x="20" y="174" width="117" height="22" rx="6" class="chip"/><text x="30" y="189">grounding-dino</text>
      <rect x="20" y="202" width="62" height="22" rx="6" class="chip"/><text x="30" y="217">curobo</text>
    </g>
  </g>

  <g transform="translate(352,156)">
    <rect width="288" height="234" rx="12" class="card"/>
    <rect width="288" height="5" fill="#2E8B57" clip-path="url(#cardclip)"/>
    <rect x="20" y="22" width="38" height="38" rx="10" fill="#E8F5EE"/>
    <g transform="translate(21,23)" fill="none" stroke="#2E8B57" stroke-width="2.2" stroke-linecap="round">
      <path d="M13,18 L24,11 M13,18 L24,25"/>
      <circle cx="10" cy="18" r="4" fill="#2E8B57"/>
      <circle cx="27" cy="10" r="3.5"/>
      <circle cx="27" cy="26" r="3.5"/>
    </g>
    <text x="70" y="49" font-size="21" font-weight="700" fill="#217346">Skills</text>
    <text x="20" y="90" font-size="13.5" class="s">Reusable steps of a task, with</text>
    <text x="20" y="109" font-size="13.5" class="s">named exits like grasped / failed.</text>
    <g font-size="11.5" class="m" fill="#1F2933">
      <rect x="20" y="146" width="145" height="22" rx="6" class="chip"/><text x="30" y="161">perceiving-objects</text>
      <rect x="20" y="174" width="152" height="22" rx="6" class="chip"/><text x="30" y="189">grasping-short-axis</text>
      <rect x="20" y="202" width="159" height="22" rx="6" class="chip"/><text x="30" y="217">transporting-objects</text>
    </g>
  </g>

  <g transform="translate(656,156)">
    <rect width="288" height="234" rx="12" class="card"/>
    <rect width="288" height="5" fill="#C2621B" clip-path="url(#cardclip)"/>
    <rect x="20" y="22" width="38" height="38" rx="10" fill="#FCEFE4"/>
    <g transform="translate(21,23)" stroke="#C2621B" stroke-width="1.3" fill="#C2621B">
      <path d="M8,12 L18,8 M8,12 L18,18 M8,12 L18,28 M8,24 L18,8 M8,24 L18,18 M8,24 L18,28 M18,8 L28,18 M18,18 L28,18 M18,28 L28,18" fill="none"/>
      <circle cx="8" cy="12" r="3"/><circle cx="8" cy="24" r="3"/>
      <circle cx="18" cy="8" r="3"/><circle cx="18" cy="18" r="3"/><circle cx="18" cy="28" r="3"/>
      <circle cx="28" cy="18" r="3"/>
    </g>
    <text x="70" y="49" font-size="21" font-weight="700" fill="#A3520F">Policies</text>
    <text x="20" y="90" font-size="13.5" class="s">Trained checkpoints, each tied to</text>
    <text x="20" y="109" font-size="13.5" class="s">the robot it was trained on.</text>
    <g font-size="11.5" class="m" fill="#1F2933">
      <rect x="20" y="146" width="96" height="22" rx="6" class="chip"/><text x="30" y="161">pi05-libero</text>
      <rect x="20" y="174" width="124" height="22" rx="6" class="chip"/><text x="30" y="189">molmoact-libero</text>
    </g>
  </g>

  <g transform="translate(960,156)">
    <rect width="288" height="234" rx="12" class="card"/>
    <rect width="288" height="5" fill="#7A4FB0" clip-path="url(#cardclip)"/>
    <rect x="20" y="22" width="38" height="38" rx="10" fill="#F2ECF9"/>
    <g transform="translate(21,23)" fill="none" stroke="#7A4FB0" stroke-width="2.2" stroke-linecap="round">
      <path d="M8,25 L18,11 L28,25"/>
      <circle cx="8" cy="25" r="3.8" fill="#F2ECF9"/>
      <circle cx="18" cy="11" r="3.8" fill="#7A4FB0"/>
      <circle cx="28" cy="25" r="3.8" fill="#F2ECF9"/>
    </g>
    <text x="70" y="49" font-size="21" font-weight="700" fill="#643C99">Recipes</text>
    <text x="20" y="90" font-size="13.5" class="s">Whole tasks: which skills to use</text>
    <text x="20" y="109" font-size="13.5" class="s">and where each exit leads.</text>
    <g font-size="11.5" class="m" fill="#1F2933">
      <rect x="20" y="146" width="173" height="22" rx="6" class="chip"/><text x="30" y="161">pick-place-camera-only</text>
    </g>
  </g>

  <g transform="translate(1264,156)">
    <rect width="288" height="234" rx="12" class="card"/>
    <rect width="288" height="5" fill="#616E7C" clip-path="url(#cardclip)"/>
    <rect x="20" y="22" width="38" height="38" rx="10" fill="#F0F2F4"/>
    <g transform="translate(21,23)" fill="none" stroke="#616E7C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M10,5 H21 L27,11 V31 H10 Z"/>
      <path d="M21,5 V11 H27"/>
      <path d="M14,17 H23 M14,21.5 H23 M14,26 H20"/>
    </g>
    <text x="70" y="49" font-size="21" font-weight="700" fill="#4A5563">Papers</text>
    <text x="20" y="90" font-size="13.5" class="s">The methods behind the bundles,</text>
    <text x="20" y="109" font-size="13.5" class="s">linked to what implements them.</text>
    <g font-size="11.5" class="m" fill="#1F2933">
      <rect x="20" y="146" width="96" height="22" rx="6" class="chip"/><text x="30" y="161">curobo-2023</text>
    </g>
  </g>

  <text x="800" y="422" text-anchor="middle" font-size="14" class="q">Skills call tools   &#183;   recipes chain skills and policies   &#183;   papers explain where each one comes from</text>

  <!-- ===================== how to use ===================== -->
  <text x="48" y="470" class="label">HOW TO USE</text>

  <!-- 1 describe -->
  <g transform="translate(48,486)">
    <rect width="346" height="340" rx="14" class="panel"/>
    <circle cx="32" cy="36" r="16" fill="#1F2933"/>
    <text x="32" y="41.5" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
    <text x="58" y="43" font-size="21" class="h">Describe</text>
    <text x="24" y="76" font-size="14" class="s">Say what the robot should do,</text>
    <text x="24" y="96" font-size="14" class="s">and which robot it is.</text>

    <rect x="24" y="116" width="298" height="60" rx="12" class="card" stroke="#CBD2D9"/>
    <text x="40" y="137" font-size="11.5" font-weight="700" class="q">TASK</text>
    <text x="40" y="161" font-size="15" font-style="italic" fill="#1F2933">&#8220;Put the red block in the bowl&#8221;</text>

    <rect x="24" y="192" width="298" height="130" rx="12" class="card" stroke="#CBD2D9"/>
    <text x="40" y="213" font-size="11.5" font-weight="700" class="q">ROBOT</text>
    <use href="#arm" x="34" y="222" width="96" height="88"/>
    <g font-size="12" fill="#1F2933">
      <rect x="146" y="226" width="68" height="22" rx="11" fill="#EEF1F4"/><text x="156" y="241">YAM arm</text>
      <rect x="146" y="254" width="156" height="22" rx="11" fill="#EEF1F4"/><text x="156" y="269">6-DoF &#183; parallel jaw</text>
      <rect x="146" y="282" width="102" height="22" rx="11" fill="#EEF1F4"/><text x="156" y="297">wrist camera</text>
    </g>
  </g>
  <line x1="400" y1="656" x2="427" y2="656" class="flow" marker-end="url(#ah)"/>

  <!-- 2 select -->
  <g transform="translate(434,486)">
    <rect width="346" height="340" rx="14" class="panel"/>
    <circle cx="32" cy="36" r="16" fill="#1F2933"/>
    <text x="32" y="41.5" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
    <text x="58" y="43" font-size="21" class="h">Select</text>
    <text x="24" y="76" font-size="14" class="s">The library keeps what runs on</text>
    <text x="24" y="96" font-size="14" class="s">that robot, and says why not.</text>

    <g font-size="12">
      <rect x="24" y="116" width="298" height="25" rx="7" class="card"/>
      <circle cx="38" cy="128.5" r="4.5" fill="#2E8B57"/>
      <text x="50" y="133" class="m" fill="#1F2933">perceiving-objects</text>
      <circle cx="306" cy="128.5" r="7.5" fill="#2E8B57"/>
      <path d="M302.5,128.7 L305.2,131.4 L309.8,125.8" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="24" y="145" width="298" height="25" rx="7" class="card"/>
      <circle cx="38" cy="157.5" r="4.5" fill="#2E8B57"/>
      <text x="50" y="162" class="m" fill="#1F2933">grasping-short-axis</text>
      <circle cx="306" cy="157.5" r="7.5" fill="#2E8B57"/>
      <path d="M302.5,157.7 L305.2,160.4 L309.8,154.8" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="24" y="174" width="298" height="25" rx="7" class="card"/>
      <circle cx="38" cy="186.5" r="4.5" fill="#2E8B57"/>
      <text x="50" y="191" class="m" fill="#1F2933">transporting-objects</text>
      <circle cx="306" cy="186.5" r="7.5" fill="#2E8B57"/>
      <path d="M302.5,186.7 L305.2,189.4 L309.8,183.8" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="24" y="203" width="298" height="25" rx="7" class="card"/>
      <circle cx="38" cy="215.5" r="4.5" fill="#2F6FB7"/>
      <text x="50" y="220" class="m" fill="#1F2933">sam3</text>
      <circle cx="306" cy="215.5" r="7.5" fill="#2E8B57"/>
      <path d="M302.5,215.7 L305.2,218.4 L309.8,212.8" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="24" y="232" width="298" height="25" rx="7" class="card"/>
      <circle cx="38" cy="244.5" r="4.5" fill="#C2621B" opacity="0.5"/>
      <text x="50" y="249" class="m q" text-decoration="line-through">pi05-libero</text>
      <text x="292" y="249" text-anchor="end" font-size="11.5" font-style="italic" class="q">Franka only</text>
      <circle cx="306" cy="244.5" r="7.5" fill="#CBD2D9"/>
      <path d="M303.3,241.8 L308.7,247.2 M308.7,241.8 L303.3,247.2" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>

      <rect x="24" y="261" width="298" height="25" rx="7" class="card"/>
      <circle cx="38" cy="273.5" r="4.5" fill="#2E8B57" opacity="0.5"/>
      <text x="50" y="278" class="m q" text-decoration="line-through">proposing-side-grasps</text>
      <text x="292" y="278" text-anchor="end" font-size="11.5" font-style="italic" class="q">sim only</text>
      <circle cx="306" cy="273.5" r="7.5" fill="#CBD2D9"/>
      <path d="M303.3,270.8 L308.7,276.2 M308.7,270.8 L303.3,276.2" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>

      <rect x="24" y="290" width="298" height="25" rx="7" class="card"/>
      <circle cx="38" cy="302.5" r="4.5" fill="#2E8B57" opacity="0.5"/>
      <text x="50" y="307" class="m q" text-decoration="line-through">plugging-a-cable-end</text>
      <text x="292" y="307" text-anchor="end" font-size="11.5" font-style="italic" class="q">two arms</text>
      <circle cx="306" cy="302.5" r="7.5" fill="#CBD2D9"/>
      <path d="M303.3,299.8 L308.7,305.2 M308.7,299.8 L303.3,305.2" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>
  <line x1="786" y1="656" x2="813" y2="656" class="flow" marker-end="url(#ah)"/>

  <!-- 3 compose -->
  <g transform="translate(820,486)">
    <rect width="346" height="340" rx="14" class="panel"/>
    <circle cx="32" cy="36" r="16" fill="#1F2933"/>
    <text x="32" y="41.5" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
    <text x="58" y="43" font-size="21" class="h">Compose</text>
    <text x="24" y="76" font-size="14" class="s">Graph-as-Policy wires the chosen</text>
    <text x="24" y="96" font-size="14" class="s">skills into a graph, by their exits.</text>

    <g font-size="13" font-weight="600" text-anchor="middle" fill="#217346">
      <rect x="96" y="118" width="128" height="30" rx="15" fill="#E8F5EE" stroke="#2E8B57" stroke-width="1.2"/><text x="160" y="138">perceive</text>
      <rect x="96" y="176" width="128" height="30" rx="15" fill="#E8F5EE" stroke="#2E8B57" stroke-width="1.2"/><text x="160" y="196">grasp</text>
      <rect x="96" y="234" width="128" height="30" rx="15" fill="#E8F5EE" stroke="#2E8B57" stroke-width="1.2"/><text x="160" y="254">transport</text>
    </g>
    <circle cx="160" cy="300" r="12" fill="#1F2933"/>
    <circle cx="160" cy="300" r="7" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="180" y="304.5" font-size="12" class="q">done</text>

    <g font-size="12.5" font-style="italic" fill="#52606D">
      <line x1="160" y1="149" x2="160" y2="174" class="flow" marker-end="url(#ah)"/><text x="170" y="166">found</text>
      <line x1="160" y1="207" x2="160" y2="232" class="flow" marker-end="url(#ah)"/><text x="170" y="224">grasped</text>
      <line x1="160" y1="265" x2="160" y2="286" class="flow" marker-end="url(#ah)"/><text x="170" y="280">placed</text>
    </g>
    <path d="M95,191 C58,191 58,133 93,133" fill="none" stroke="#B83232" stroke-width="1.4" marker-end="url(#ahr)"/>
    <text x="56" y="166" text-anchor="end" font-size="12.5" font-style="italic" fill="#B83232">failed</text>

    <g font-size="11" class="m" fill="#24598F">
      <line x1="225" y1="133" x2="248" y2="133" stroke="#2F6FB7" stroke-dasharray="2 2"/>
      <rect x="248" y="123" width="48" height="20" rx="10" fill="#EAF2FB" stroke="#2F6FB7" stroke-opacity="0.5"/><text x="272" y="137" text-anchor="middle">sam3</text>
      <line x1="225" y1="191" x2="248" y2="191" stroke="#2F6FB7" stroke-dasharray="2 2"/>
      <rect x="248" y="181" width="60" height="20" rx="10" fill="#EAF2FB" stroke="#2F6FB7" stroke-opacity="0.5"/><text x="278" y="195" text-anchor="middle">curobo</text>
    </g>
  </g>
  <line x1="1172" y1="656" x2="1199" y2="656" class="flow" marker-end="url(#ah)"/>

  <!-- 4 run -->
  <g transform="translate(1206,486)">
    <rect width="346" height="340" rx="14" class="panel"/>
    <circle cx="32" cy="36" r="16" fill="#1F2933"/>
    <text x="32" y="41.5" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">4</text>
    <text x="58" y="43" font-size="21" class="h">Run</text>
    <text x="24" y="76" font-size="14" class="s">Test it in simulation, then run</text>
    <text x="24" y="96" font-size="14" class="s">the same graph on the real robot.</text>

    <rect x="24" y="120" width="132" height="146" rx="10" fill="#EEF4FB" stroke="#BCCCDC"/>
    <path d="M36,234 H144 M36,234 L28,250 M60,234 L56,250 M84,234 L84,250 M108,234 L112,250 M132,234 L140,250" stroke="#BCCCDC" stroke-width="1"/>
    <use href="#arm" x="40" y="140" width="96" height="88"/>
    <text x="90" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2933">Simulation</text>
    <circle cx="140" cy="136" r="9" fill="#2E8B57"/>
    <path d="M136,136.2 L139,139.2 L144.4,133" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="161" y1="193" x2="184" y2="193" class="flow" marker-end="url(#ah)"/>

    <rect x="190" y="120" width="132" height="146" rx="10" fill="#FFFFFF" stroke="#CBD2D9"/>
    <line x1="202" y1="234" x2="310" y2="234" stroke="#CBD2D9"/>
    <use href="#arm" x="206" y="140" width="96" height="88"/>
    <text x="256" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2933">Real robot</text>

    <text x="173" y="296" text-anchor="middle" font-size="13.5" class="s">Same skills, same weights:</text>
    <text x="173" y="315" text-anchor="middle" font-size="13.5" class="s">what passed is what runs.</text>
  </g>
</svg>
