<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 792" width="1200" height="792" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .h { font-weight: 700; fill: #1F2933; }
      .s { fill: #52606D; }
      .q { fill: #7B8794; }
      .m { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
      .card { fill: #FFFFFF; stroke: #E4E7EB; }
      .panel { fill: #F8FAFC; stroke: #E4E7EB; }
      .chip { fill: #F3F5F7; }
      .flow { fill: none; stroke: #52606D; stroke-width: 1.8; }
      .label { font-size: 14px; font-weight: 700; letter-spacing: 1.6px; fill: #7B8794; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#52606D"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#B83232"/>
    </marker>
    <clipPath id="cardclip"><rect width="216" height="242" rx="12"/></clipPath>
    <symbol id="arm" viewBox="0 0 120 110">
      <rect x="18" y="96" width="54" height="10" rx="3" fill="#7B8794"/>
      <line x1="45" y1="92" x2="58" y2="46" stroke="#52606D" stroke-width="10" stroke-linecap="round"/>
      <line x1="58" y1="46" x2="96" y2="56" stroke="#52606D" stroke-width="8" stroke-linecap="round"/>
      <circle cx="45" cy="92" r="8" fill="#3E4C59"/>
      <circle cx="58" cy="46" r="7" fill="#3E4C59"/>
      <line x1="96" y1="56" x2="96" y2="68" stroke="#52606D" stroke-width="5" stroke-linecap="round"/>
      <path d="M88,68 H104 M89,68 V80 M103,68 V80" stroke="#52606D" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <rect x="91" y="92" width="10" height="10" rx="1.5" fill="#D64545"/>
    </symbol>
    <g id="ok">
      <circle r="8" fill="#2E8B57"/>
      <path d="M-3.6,0.2 L-0.9,2.9 L3.8,-2.8" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="no">
      <circle r="8" fill="#CBD2D9"/>
      <path d="M-2.8,-2.8 L2.8,2.8 M2.8,-2.8 L-2.8,2.8" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1200" height="792" fill="#FFFFFF"/>

  <!-- ===================== what's inside ===================== -->
  <text x="24" y="34" class="label">WHAT&#8217;S INSIDE</text>

  <g transform="translate(24,50)">
    <rect width="216" height="242" rx="12" class="card"/>
    <rect width="216" height="5" fill="#2F6FB7" clip-path="url(#cardclip)"/>
    <rect x="16" y="22" width="40" height="40" rx="10" fill="#EAF2FB"/>
    <g transform="translate(18,24)" fill="none" stroke="#2F6FB7" stroke-width="2.2" stroke-linecap="round">
      <circle cx="18" cy="18" r="8"/>
      <path d="M18,5 V11 M18,25 V31 M5,18 H11 M25,18 H31"/>
      <circle cx="18" cy="18" r="1.8" fill="#2F6FB7" stroke="none"/>
    </g>
    <text x="66" y="51" font-size="23" font-weight="700" fill="#24598F">Tools</text>
    <text x="16" y="94" font-size="16" class="s">Models and solvers</text>
    <text x="16" y="116" font-size="16" class="s">that skills call.</text>
    <g font-size="12.5" class="m" fill="#1F2933">
      <rect x="16" y="136" width="46" height="26" rx="6" class="chip"/><text x="24" y="153.5">sam3</text>
      <rect x="16" y="168" width="121" height="26" rx="6" class="chip"/><text x="24" y="185.5">grounding-dino</text>
      <rect x="16" y="200" width="61" height="26" rx="6" class="chip"/><text x="24" y="217.5">curobo</text>
    </g>
  </g>

  <g transform="translate(258,50)">
    <rect width="216" height="242" rx="12" class="card"/>
    <rect width="216" height="5" fill="#2E8B57" clip-path="url(#cardclip)"/>
    <rect x="16" y="22" width="40" height="40" rx="10" fill="#E8F5EE"/>
    <g transform="translate(18,24)" fill="none" stroke="#2E8B57" stroke-width="2.2" stroke-linecap="round">
      <path d="M13,18 L24,11 M13,18 L24,25"/>
      <circle cx="10" cy="18" r="4" fill="#2E8B57"/>
      <circle cx="27" cy="10" r="3.5"/>
      <circle cx="27" cy="26" r="3.5"/>
    </g>
    <text x="66" y="51" font-size="23" font-weight="700" fill="#217346">Skills</text>
    <text x="16" y="94" font-size="16" class="s">Reusable task steps</text>
    <text x="16" y="116" font-size="16" class="s">with named exits.</text>
    <g font-size="12.5" class="m" fill="#1F2933">
      <rect x="16" y="136" width="151" height="26" rx="6" class="chip"/><text x="24" y="153.5">perceiving-objects</text>
      <rect x="16" y="168" width="159" height="26" rx="6" class="chip"/><text x="24" y="185.5">grasping-short-axis</text>
      <rect x="16" y="200" width="166" height="26" rx="6" class="chip"/><text x="24" y="217.5">transporting-objects</text>
    </g>
  </g>

  <g transform="translate(492,50)">
    <rect width="216" height="242" rx="12" class="card"/>
    <rect width="216" height="5" fill="#C2621B" clip-path="url(#cardclip)"/>
    <rect x="16" y="22" width="40" height="40" rx="10" fill="#FCEFE4"/>
    <g transform="translate(18,24)" stroke="#C2621B" stroke-width="1.3" fill="#C2621B">
      <path d="M8,12 L18,8 M8,12 L18,18 M8,12 L18,28 M8,24 L18,8 M8,24 L18,18 M8,24 L18,28 M18,8 L28,18 M18,18 L28,18 M18,28 L28,18" fill="none"/>
      <circle cx="8" cy="12" r="3"/><circle cx="8" cy="24" r="3"/>
      <circle cx="18" cy="8" r="3"/><circle cx="18" cy="18" r="3"/><circle cx="18" cy="28" r="3"/>
      <circle cx="28" cy="18" r="3"/>
    </g>
    <text x="66" y="51" font-size="23" font-weight="700" fill="#A3520F">Policies</text>
    <text x="16" y="94" font-size="16" class="s">Trained checkpoints,</text>
    <text x="16" y="116" font-size="16" class="s">each for one robot.</text>
    <g font-size="12.5" class="m" fill="#1F2933">
      <rect x="16" y="136" width="99" height="26" rx="6" class="chip"/><text x="24" y="153.5">pi05-libero</text>
      <rect x="16" y="168" width="129" height="26" rx="6" class="chip"/><text x="24" y="185.5">molmoact-libero</text>
    </g>
  </g>

  <g transform="translate(726,50)">
    <rect width="216" height="242" rx="12" class="card"/>
    <rect width="216" height="5" fill="#7A4FB0" clip-path="url(#cardclip)"/>
    <rect x="16" y="22" width="40" height="40" rx="10" fill="#F2ECF9"/>
    <g transform="translate(18,24)" fill="none" stroke="#7A4FB0" stroke-width="2.2" stroke-linecap="round">
      <path d="M8,25 L18,11 L28,25"/>
      <circle cx="8" cy="25" r="3.8" fill="#F2ECF9"/>
      <circle cx="18" cy="11" r="3.8" fill="#7A4FB0"/>
      <circle cx="28" cy="25" r="3.8" fill="#F2ECF9"/>
    </g>
    <text x="66" y="51" font-size="23" font-weight="700" fill="#643C99">Recipes</text>
    <text x="16" y="94" font-size="16" class="s">Whole tasks, wired</text>
    <text x="16" y="116" font-size="16" class="s">skill by skill.</text>
    <g font-size="12.5" class="m" fill="#1F2933">
      <rect x="16" y="136" width="181" height="26" rx="6" class="chip"/><text x="24" y="153.5">pick-place-camera-only</text>
    </g>
  </g>

  <g transform="translate(960,50)">
    <rect width="216" height="242" rx="12" class="card"/>
    <rect width="216" height="5" fill="#616E7C" clip-path="url(#cardclip)"/>
    <rect x="16" y="22" width="40" height="40" rx="10" fill="#F0F2F4"/>
    <g transform="translate(18,24)" fill="none" stroke="#616E7C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M10,5 H21 L27,11 V31 H10 Z"/>
      <path d="M21,5 V11 H27"/>
      <path d="M14,17 H23 M14,21.5 H23 M14,26 H20"/>
    </g>
    <text x="66" y="51" font-size="23" font-weight="700" fill="#4A5563">Papers</text>
    <text x="16" y="94" font-size="16" class="s">The methods behind</text>
    <text x="16" y="116" font-size="16" class="s">each bundle.</text>
    <g font-size="12.5" class="m" fill="#1F2933">
      <rect x="16" y="136" width="99" height="26" rx="6" class="chip"/><text x="24" y="153.5">curobo-2023</text>
    </g>
  </g>

  <text x="600" y="324" text-anchor="middle" font-size="15" class="q">Skills call tools   &#183;   recipes chain skills and policies   &#183;   papers explain where each comes from</text>

  <!-- ===================== how to use ===================== -->
  <text x="24" y="368" class="label">HOW TO USE</text>

  <!-- 1 describe -->
  <g transform="translate(24,384)">
    <rect width="270" height="386" rx="14" class="panel"/>
    <circle cx="34" cy="36" r="17" fill="#1F2933"/>
    <text x="34" y="41.5" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
    <text x="62" y="44" font-size="23" class="h">Describe</text>
    <text x="18" y="80" font-size="16" class="s">Say what the robot should</text>
    <text x="18" y="102" font-size="16" class="s">do, and which robot it is.</text>

    <rect x="18" y="124" width="234" height="86" rx="12" class="card" stroke="#CBD2D9"/>
    <text x="32" y="146" font-size="12" font-weight="700" letter-spacing="1" class="q">TASK</text>
    <text x="32" y="172" font-size="16" font-style="italic" fill="#1F2933">&#8220;Put the red block</text>
    <text x="32" y="194" font-size="16" font-style="italic" fill="#1F2933">in the bowl&#8221;</text>

    <rect x="18" y="224" width="234" height="146" rx="12" class="card" stroke="#CBD2D9"/>
    <text x="32" y="246" font-size="12" font-weight="700" letter-spacing="1" class="q">ROBOT</text>
    <use href="#arm" x="24" y="256" width="92" height="84"/>
    <g font-size="13" fill="#1F2933">
      <rect x="122" y="252" width="70" height="24" rx="12" fill="#EEF1F4"/><text x="133" y="268.5">YAM arm</text>
      <rect x="122" y="280" width="58" height="24" rx="12" fill="#EEF1F4"/><text x="133" y="296.5">6-DoF</text>
      <rect x="122" y="308" width="102" height="24" rx="12" fill="#EEF1F4"/><text x="133" y="324.5">parallel jaw</text>
      <rect x="122" y="336" width="106" height="24" rx="12" fill="#EEF1F4"/><text x="133" y="352.5">wrist camera</text>
    </g>
  </g>
  <line x1="297" y1="577" x2="315" y2="577" class="flow" marker-end="url(#ah)"/>

  <!-- 2 select -->
  <g transform="translate(318,384)">
    <rect width="270" height="386" rx="14" class="panel"/>
    <circle cx="34" cy="36" r="17" fill="#1F2933"/>
    <text x="34" y="41.5" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
    <text x="62" y="44" font-size="23" class="h">Select</text>
    <text x="18" y="80" font-size="16" class="s">Keep what runs on that</text>
    <text x="18" y="102" font-size="16" class="s">robot, and say why not.</text>

    <g font-size="12.5" class="m">
      <rect x="18" y="124" width="234" height="30" rx="7" class="card"/>
      <circle cx="32" cy="139" r="4.5" fill="#2E8B57"/>
      <text x="44" y="143.5" fill="#1F2933">perceiving-objects</text>
      <use href="#ok" x="236" y="139"/>

      <rect x="18" y="158" width="234" height="30" rx="7" class="card"/>
      <circle cx="32" cy="173" r="4.5" fill="#2E8B57"/>
      <text x="44" y="177.5" fill="#1F2933">grasping-short-axis</text>
      <use href="#ok" x="236" y="173"/>

      <rect x="18" y="192" width="234" height="30" rx="7" class="card"/>
      <circle cx="32" cy="207" r="4.5" fill="#2F6FB7"/>
      <text x="44" y="211.5" fill="#1F2933">sam3</text>
      <use href="#ok" x="236" y="207"/>

      <rect x="18" y="230" width="234" height="44" rx="7" class="card"/>
      <circle cx="32" cy="245" r="4.5" fill="#C2621B" opacity="0.5"/>
      <text x="44" y="249.5" class="q" text-decoration="line-through">pi05-libero</text>
      <use href="#no" x="236" y="252"/>

      <rect x="18" y="278" width="234" height="44" rx="7" class="card"/>
      <circle cx="32" cy="293" r="4.5" fill="#2E8B57" opacity="0.5"/>
      <text x="44" y="297.5" class="q" text-decoration="line-through">proposing-side-grasps</text>
      <use href="#no" x="236" y="300"/>

      <rect x="18" y="326" width="234" height="44" rx="7" class="card"/>
      <circle cx="32" cy="341" r="4.5" fill="#2E8B57" opacity="0.5"/>
      <text x="44" y="345.5" class="q" text-decoration="line-through">plugging-a-cable-end</text>
      <use href="#no" x="236" y="348"/>
    </g>
    <g font-size="12.5" font-style="italic" class="q">
      <text x="44" y="266">trained on a Franka arm</text>
      <text x="44" y="314">reads simulator ground truth</text>
      <text x="44" y="362">needs two arms</text>
    </g>
  </g>
  <line x1="591" y1="577" x2="609" y2="577" class="flow" marker-end="url(#ah)"/>

  <!-- 3 compose -->
  <g transform="translate(612,384)">
    <rect width="270" height="386" rx="14" class="panel"/>
    <circle cx="34" cy="36" r="17" fill="#1F2933"/>
    <text x="34" y="41.5" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
    <text x="62" y="44" font-size="23" class="h">Compose</text>
    <text x="18" y="80" font-size="16" class="s">A planner wires the skills</text>
    <text x="18" y="102" font-size="16" class="s">as a graph or as code.</text>

    <g font-size="13" font-weight="600" text-anchor="middle" fill="#217346">
      <rect x="21" y="128" width="52" height="30" rx="15" fill="#E8F5EE" stroke="#2E8B57" stroke-width="1.2"/><text x="47" y="147.5">find</text>
      <rect x="103" y="128" width="60" height="30" rx="15" fill="#E8F5EE" stroke="#2E8B57" stroke-width="1.2"/><text x="133" y="147.5">grasp</text>
      <rect x="193" y="128" width="56" height="30" rx="15" fill="#E8F5EE" stroke="#2E8B57" stroke-width="1.2"/><text x="221" y="147.5">carry</text>
    </g>
    <line x1="74" y1="143" x2="101" y2="143" class="flow" marker-end="url(#ah)"/>
    <line x1="164" y1="143" x2="191" y2="143" class="flow" marker-end="url(#ah)"/>
    <path d="M131,159 C124,190 54,190 48,161" fill="none" stroke="#B83232" stroke-width="1.5" marker-end="url(#ahr)"/>
    <text x="90" y="204" text-anchor="middle" font-size="13" font-style="italic" fill="#B83232">failed</text>

    <line x1="18" y1="226" x2="118" y2="226" stroke="#D9DEE3"/>
    <text x="135" y="230.5" text-anchor="middle" font-size="13.5" font-style="italic" class="q">or</text>
    <line x1="152" y1="226" x2="252" y2="226" stroke="#D9DEE3"/>

    <rect x="18" y="244" width="234" height="126" rx="10" fill="#1F2933"/>
    <g font-size="13.5" class="m" fill="#E4E7EB">
      <text x="34" y="276">obj = <tspan fill="#7FD1AE">find</tspan>(<tspan fill="#F5B971">"block"</tspan>)</text>
      <text x="34" y="300"><tspan fill="#8AB4F8">if</tspan> <tspan fill="#7FD1AE">grasp</tspan>(obj):</text>
      <text x="66.4" y="324"><tspan fill="#7FD1AE">carry</tspan>(obj, <tspan fill="#F5B971">"bowl"</tspan>)</text>
      <text x="34" y="348"><tspan fill="#8AB4F8">else</tspan>: retry()</text>
    </g>
  </g>
  <line x1="885" y1="577" x2="903" y2="577" class="flow" marker-end="url(#ah)"/>

  <!-- 4 run -->
  <g transform="translate(906,384)">
    <rect width="270" height="386" rx="14" class="panel"/>
    <circle cx="34" cy="36" r="17" fill="#1F2933"/>
    <text x="34" y="41.5" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">4</text>
    <text x="62" y="44" font-size="23" class="h">Run</text>
    <text x="18" y="80" font-size="16" class="s">Test in simulation, then run</text>
    <text x="18" y="102" font-size="16" class="s">the same policy on the robot.</text>

    <rect x="18" y="128" width="104" height="146" rx="10" fill="#EEF4FB" stroke="#BCCCDC"/>
    <path d="M26,234 H114 M26,234 L21,246 M48,234 L46,246 M70,234 L70,246 M92,234 L94,246 M114,234 L119,246" stroke="#BCCCDC" stroke-width="1"/>
    <use href="#arm" x="22" y="146" width="96" height="88"/>
    <text x="70" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2933">Simulation</text>
    <use href="#ok" x="108" y="142"/>

    <line x1="125" y1="201" x2="145" y2="201" class="flow" marker-end="url(#ah)"/>

    <rect x="148" y="128" width="104" height="146" rx="10" fill="#FFFFFF" stroke="#CBD2D9"/>
    <line x1="156" y1="234" x2="244" y2="234" stroke="#CBD2D9"/>
    <use href="#arm" x="152" y="146" width="96" height="88"/>
    <text x="200" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2933">Real robot</text>

    <text x="135" y="314" text-anchor="middle" font-size="16" class="s">Same skills, same weights:</text>
    <text x="135" y="338" text-anchor="middle" font-size="16" class="s">what passed is what runs.</text>
  </g>
</svg>
