[project]
name = "densereward-tool-bundle"
version = "0.1.0.dev0"
description = "DenseReward task progress 0..1 from one frame (or the last three). Runs out-of-process via gap_core.rpc.server (needs GPU)."
readme = "SKILL.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }

# The checkpoints are Qwen3-VL-4B fine-tunes (transformers >= 4.57); the model
# cards' tested environment is torch 2.8 / torchvision 0.23 (cu128),
# transformers 5.2.0, accelerate 1.13.0, which the live check ran.
dependencies = [
  "graph-as-policy-core",
  "torch==2.8.*",
  "torchvision==0.23.*",
  "transformers==5.2.0",
  "accelerate",
  "huggingface_hub",
  "pillow>=10",
  "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.metadata]
allow-direct-references = true

# The engine commit sources.yaml pins, by URL, so the bundle resolves the same
# wherever its checkout sits (a dev clone, a robot's `roboskillhub fetch`).
[tool.uv.sources]
graph-as-policy-core = { git = "https://github.com/graph-robots/graph-as-policy.git", rev = "09e45f8de27bc1a29629382ed7c2b9b4b384b3d6", subdirectory = "gap-core" }
