[project]
name = "rynnvalue-tool-bundle"
version = "0.1.0.dev0"
description = "RynnValue remaining time to completion for each frame of a clip, plus Match/Success. Runs out-of-process via gap_core.rpc.server (needs GPU)."
readme = "SKILL.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }

# The checkpoints load with trust_remote_code on transformers 4.57 (RynnValue's
# pyproject pins >=4.57,<5); the live check ran torch 2.8.0+cu128,
# transformers 4.57.6, accelerate, einops on an RTX PRO 6000.
dependencies = [
  "graph-as-policy-core",
  "torch==2.8.*",
  "torchvision==0.23.*",
  "transformers>=4.57,<5",
  "accelerate",
  "einops>=0.8",
  "huggingface_hub",
  "pillow>=10",
  "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
graph-as-policy-core = { git = "https://github.com/graph-robots/graph-as-policy.git", rev = "09e45f8de27bc1a29629382ed7c2b9b4b384b3d6", subdirectory = "gap-core" }
