[project]
name = "owlv2-tool-bundle"
version = "0.1.0.dev0"
description = "OWLv2 open-vocabulary detection by text and by exemplar (image-guided one-shot). Runs out-of-process via gap_core.rpc.server (needs GPU)."
readme = "SKILL.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
  "graph-as-policy-core",
  # Owlv2ForObjectDetection / Owlv2Processor arrived in transformers 4.35;
  # the bundle preprocesses on the device itself, so torchvision is not needed.
  "torch>=2.7",
  "transformers>=4.41",
  "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.metadata]
allow-direct-references = true

# The engine commit sources.yaml pins, by URL, so the bundle resolves the same
# wherever its checkout sits (a dev clone, a robot's `roboskillhub fetch`).
[tool.uv.sources]
graph-as-policy-core = { git = "https://github.com/graph-robots/graph-as-policy.git", rev = "09e45f8de27bc1a29629382ed7c2b9b4b384b3d6", subdirectory = "gap-core" }
