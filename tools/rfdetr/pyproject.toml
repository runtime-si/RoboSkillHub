[project]
name = "rfdetr-tool-bundle"
version = "0.1.0.dev0"
description = "Train and run RF-DETR (Apache-2.0 sizes) station-specific detectors. Runs out-of-process via gap_core.rpc.server (needs GPU)."
readme = "SKILL.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
  "graph-as-policy-core",
  # rfdetr 1.12.0: Apache-2.0 code and Nano / Small / Medium / Large weights; the PML-1.0 sizes
  # are only in the optional rfdetr[plus] extra, which this bundle does not install.
  "rfdetr[train]==1.12.0",
  "torch>=2.7",
  "torchvision>=0.22",
  "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.metadata]
allow-direct-references = true

# The engine commit sources.yaml pins, by URL, so the bundle resolves the same
# wherever its checkout sits (a dev clone, a robot's `roboskillhub fetch`).
[tool.uv.sources]
graph-as-policy-core = { git = "https://github.com/graph-robots/graph-as-policy.git", rev = "09e45f8de27bc1a29629382ed7c2b9b4b384b3d6", subdirectory = "gap-core" }
