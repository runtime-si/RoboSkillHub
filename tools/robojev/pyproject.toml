[project]
name = "robojev-tool-bundle"
version = "0.1.0.dev0"
description = "RoboJev-27B success judge: P(task done) from an attempt's frames. Runs out-of-process via gap_core.rpc.server (needs a GPU with ~56 GB)."
readme = "SKILL.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
  "graph-as-policy-core",
  # Qwen3_5ForConditionalGeneration (model_type qwen3_5) and its mm_token_type_ids.
  "torch>=2.7",
  "transformers>=5.19",
  "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
graph-as-policy-core = { git = "https://github.com/graph-robots/graph-as-policy.git", rev = "09e45f8de27bc1a29629382ed7c2b9b4b384b3d6", subdirectory = "gap-core" }
