[project]
name = "colour-tool-bundle"
version = "0.1.0.dev0"
description = "What colour a segmented part is: CIEDE2000 palette classification (LEGO/DUPLO, domino, custom), white balance and dominant colours, for gap. Runs out-of-process via gap_core.rpc.server."
readme = "SKILL.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
  # Tool-server entry point + @tool decorator + types/errors.
  "graph-as-policy-core",
  # Everything else: sRGB/Lab conversion, the vendored CIEDE2000, k-means.
  "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# No code ships in the wheel — the bundle is invoked by path (cwd) via
# `uv run --project tools/colour -- python -m gap_core.rpc.server …`,
# which imports the in-place `tools.py` directly.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.metadata]
allow-direct-references = true

# The engine commit sources.yaml pins, by URL, so the bundle resolves the same
# wherever its checkout sits (a dev clone, a robot's `roboskillhub fetch`).
[tool.uv.sources]
graph-as-policy-core = { git = "https://github.com/graph-robots/graph-as-policy.git", rev = "09e45f8de27bc1a29629382ed7c2b9b4b384b3d6", subdirectory = "gap-core" }
