[project]
name = "grconvnet-tool-bundle"
version = "0.1.0.dev0"
description = "GR-ConvNet planar grasp proposals from an RGB-D frame. Runs out-of-process via gap_core.rpc.server (CPU or GPU)."
readme = "SKILL.md"
requires-python = ">=3.11,<3.13"
license = { text = "BSD-3-Clause" }

# The network (inference/models/grconvnet3.py, ~1.9 M parameters) is copied
# into tools.py, so the bundle needs no checkout of skumra/robotic-grasping;
# the checkpoint is downloaded from it at a pinned commit. torch as tools/depth
# pins it (CUDA 12.8 wheels, which also run on a CPU-only machine).
dependencies = [
  "graph-as-policy-core",
  "torch==2.9.1",
  "numpy",
  "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.metadata]
allow-direct-references = true

# The engine commit sources.yaml pins, by URL, so the bundle resolves the same
# wherever its checkout sits (a dev clone, a robot's `roboskillhub fetch`).
[tool.uv.sources]
graph-as-policy-core = { git = "https://github.com/graph-robots/graph-as-policy.git", rev = "09e45f8de27bc1a29629382ed7c2b9b4b384b3d6", subdirectory = "gap-core" }
