[project]
name = "musc-tool-bundle"
version = "0.1.0.dev0"
description = "MuSc zero-shot mutual anomaly scoring of nominally identical images with DINOv2. Runs out-of-process via gap_core.rpc.server (needs GPU)."
readme = "SKILL.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "graph-as-policy-core",
  # Dinov2Model with output_hidden_states and its final layernorm.
  "torch>=2.7",
  "transformers>=4.41",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.metadata]
allow-direct-references = true

# The engine commit sources.yaml pins, by URL, so the bundle resolves the same
# wherever its checkout sits (a dev clone, a robot's `roboskillhub fetch`).
[tool.uv.sources]
graph-as-policy-core = { git = "https://github.com/graph-robots/graph-as-policy.git", rev = "09e45f8de27bc1a29629382ed7c2b9b4b384b3d6", subdirectory = "gap-core" }
