[project]
name = "cns-tool-bundle"
version = "0.1.0.dev0"
description = "CNS learned visual servoing (keypoint graph -> camera velocity). Runs out-of-process via gap_core.rpc.server (CPU or GPU)."
readme = "SKILL.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

# Checked with torch 2.8 (cu128), torch_geometric 2.8.1, opencv-python-headless 5.0, scikit-learn,
# scikit-image (CNS's own requirements also list pybullet / open3d, used only by its simulator).
dependencies = [
  "graph-as-policy-core",
  "torch==2.8.*",
  "torch_geometric>=2.5",
  "scikit-learn",
  "scikit-image",
  "opencv-python-headless>=4.8",
  "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
graph-as-policy-core = { git = "https://github.com/graph-robots/graph-as-policy.git", rev = "09e45f8de27bc1a29629382ed7c2b9b4b384b3d6", subdirectory = "gap-core" }
