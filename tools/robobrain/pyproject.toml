[project]
name = "robobrain-tool-bundle"
version = "0.1.0.dev0"
description = "BAAI RoboBrain 2.5 keypoint traces, pointing and task progress. Runs out-of-process via gap_core.rpc.server (needs GPU)."
readme = "SKILL.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }

# The checkpoint is a Qwen3VLForConditionalGeneration (transformers >= 4.57;
# upstream's requirements.txt pins 4.57.0, the card's config was written by
# 4.57.0.dev0). torch 2.8 / torchvision 0.23 as in tools/locate-anything (the
# fast Qwen2-VL image processor needs torchvision); accelerate for device_map.
dependencies = [
  "graph-as-policy-core",
  "torch==2.8.*",
  "torchvision==0.23.*",
  "transformers==4.57.1",
  "accelerate",
  "huggingface_hub",
  "pillow>=10",
  "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.metadata]
allow-direct-references = true

# The engine commit sources.yaml pins, by URL, so the bundle resolves the same
# wherever its checkout sits (a dev clone, a robot's `roboskillhub fetch`).
[tool.uv.sources]
graph-as-policy-core = { git = "https://github.com/graph-robots/graph-as-policy.git", rev = "09e45f8de27bc1a29629382ed7c2b9b4b384b3d6", subdirectory = "gap-core" }
