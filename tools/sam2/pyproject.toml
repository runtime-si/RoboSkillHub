[project]
name = "sam2-tool-bundle"
version = "0.1.0.dev0"
description = "SAM 2.1 (or EdgeTAM) promptable video mask tracking: live sessions and recorded clips. Runs out-of-process via gap_core.rpc.server (needs GPU)."
readme = "SKILL.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
  "graph-as-policy-core",
  # EdgeTamVideoModel arrived in transformers 4.57 (Sam2VideoModel in 4.56); the SAM 2
  # video processor's fast image path needs torchvision.
  "torch>=2.7",
  "torchvision>=0.22",
  "transformers>=4.57",
  "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.metadata]
allow-direct-references = true

# The engine commit sources.yaml pins, by URL, so the bundle resolves the same
# wherever its checkout sits (a dev clone, a robot's `roboskillhub fetch`).
[tool.uv.sources]
graph-as-policy-core = { git = "https://github.com/graph-robots/graph-as-policy.git", rev = "09e45f8de27bc1a29629382ed7c2b9b4b384b3d6", subdirectory = "gap-core" }
