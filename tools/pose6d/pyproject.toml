[project]
name = "pose6d-tool-bundle"
version = "0.1.0.dev0"
description = "6D pose of known rigid parts (box / cylinder primitives, meshes) from depth for gap: analytic visibility-aware ICP, Open3D FPFH + RANSAC global registration. Runs out-of-process via gap_core.rpc.server."
readme = "SKILL.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  # Tool-server entry point + @tool decorator + types/errors.
  "graph-as-policy-core",
  "numpy>=1.26",
  # cKDTree (normals, coverage), ConvexHull (minimum-area rectangle),
  # binary_erosion (register_mask).
  "scipy>=1.12",
  # FPFH + RANSAC global registration and point-to-plane ICP for meshes; the
  # primitive fast path does not import it.
  "open3d>=0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# No code ships in the wheel — the bundle is invoked by path (cwd) via
# `uv run --project tools/pose6d -- python -m gap_core.rpc.server …`,
# which imports the in-place `tools.py` directly.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.metadata]
allow-direct-references = true

# The engine commit sources.yaml pins, by URL, so the bundle resolves the same
# wherever its checkout sits (a dev clone, a robot's `roboskillhub fetch`).
[tool.uv.sources]
graph-as-policy-core = { git = "https://github.com/graph-robots/graph-as-policy.git", rev = "09e45f8de27bc1a29629382ed7c2b9b4b384b3d6", subdirectory = "gap-core" }
