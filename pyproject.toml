[project]
name = "roboskillhub"
version = "0.1.0"
description = "RoboSkillHub: an open library of robot skills, tools and checkpoints that any robot policy can build on."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Runtime.si" }]
dependencies = [
  "pyyaml>=6.0",
  "huggingface_hub>=0.24",
]

[project.optional-dependencies]
# Graph-as-Policy's SKILL.md parser and type vocabulary. `roboskillhub check` uses
# them when importable, so a bundle that passes here also loads in gap. The
# runtime distribution (`graph-as-policy`) is installed separately with
# --no-deps: only its pure-Python skill loader is needed, not cuRobo or LIBERO.
gap = ["graph-as-policy-core"]
runtime = ["numpy>=1.24", "opencv-python-headless>=4.8", "pillow>=10"]
tapir = [
  "numpy>=1.24",
  "torch>=2.1",
  "tapnet[torch] @ git+https://github.com/google-deepmind/tapnet.git@ceedd60bb9f6c9f7c74796e4445aff6c6ddf7c9b",
]

[project.scripts]
roboskillhub = "roboskillhub.cli:main"

[dependency-groups]
# After pytest and ruff, what the bundles' tests import, all CPU-only: the
# in-process skills' OpenCV and scikit-learn, the molmo and vlm tests' mocked
# HTTP clients and test images, and the engine's episode collector (h5py).
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "httpx>=0.27",
  "pillow>=10",
  "opencv-python-headless>=4.8",
  "scikit-learn>=1.3",
  "h5py>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roboskillhub"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
graph-as-policy-core = { git = "https://github.com/graph-robots/graph-as-policy.git", rev = "09e45f8de27bc1a29629382ed7c2b9b4b384b3d6", subdirectory = "gap-core" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: talks to GitHub or the Hugging Face Hub (deselected by default)",
  "gpu: needs model weights and an NVIDIA GPU (deselected by default)",
  "llm: needs a live LLM API key (deselected by default)",
]
addopts = "-m 'not network and not gpu and not llm'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is the formatter's call; what it leaves long is prose and prompts.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The warp compatibility shim must run before the curobo imports, and the
# availability probes import modules only to learn whether they import.
"tools/curobo/_curobo_impl.py" = ["E402", "F401"]
# Vendored TrackDLO (MIT, see LICENSE.trackdlo), kept byte-close to its upstream
# so it diffs cleanly; for the same reason it is never formatted.
"tools/curve/_trackdlo.py" = ["B007", "E741", "F401", "F841", "I001", "UP032"]

[tool.ruff.format]
exclude = ["tools/curve/_trackdlo.py"]
