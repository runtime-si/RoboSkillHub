[project]
name = "robomotif"
version = "0.1.0"
description = "Motif: an open, federated library of robot skills for graph-as-policy, with checkpoints on the Hugging Face Hub."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Runtime.si" }]
dependencies = [
  "pyyaml>=6.0",
  "huggingface_hub>=0.24",
]

[project.optional-dependencies]
# The engine's own SKILL.md parser and type vocabulary. `motif check` uses them
# when importable, so a bundle that passes here is a bundle gap loads. The
# runtime distribution (`graph-as-policy`) is installed separately with
# --no-deps: only its pure-Python skill loader is needed, not cuRobo or LIBERO.
gap = ["graph-as-policy-core"]

[project.scripts]
motif = "robomotif.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robomotif"]

[tool.uv.sources]
graph-as-policy-core = { git = "https://github.com/graph-robots/graph-as-policy.git", rev = "09e45f8de27bc1a29629382ed7c2b9b4b384b3d6", subdirectory = "gap-core" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: talks to GitHub or the Hugging Face Hub (deselected by default)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
