# π0.5 fine-tuned on allenai/MolmoAct2-BimanualYAM-Dataset (LeRobot PyTorch, lerobot 0.7.0 PI05Policy).
# Same data, joint frame and gripper units as robocurve/gr00t-n1.7-yam-molmoact2 (profile yam-molmoact2).
profile: yam-pi05-molmoact2
backend: pi05
checkpoint:
  repo: helen9975/pi05-molmoact-yam
  revision: 6b50a13e959a6e4668d94df083056b6c6753f6bc   # main = step 200000 (final); tag step-100000 also published
  sha256: 4166daa8deb46ef1d410488feb26a0a355f8b813062fbcbc3a35bd72bd4d46ee   # model.safetensors
  license: card apache-2.0; weights derive from lerobot/pi05_base (openpi pi05_base, PaliGemma -> Gemma terms)
tokenizer:
  # google/paligemma-3b-pt-224 is gated; this ungated copy's tokenizer.model is byte-identical to
  # the public gs://big_vision/paligemma_tokenizer.model that openpi uses.
  repo: leo009/paligemma-3b-pt-224
  revision: 39996beb6fb17c5d16a50d3ef8f7a96ad9d03986
  sha256: 8986bb4f423f07f8c7f70d0dbe3526fb2316056c17bae71b1ea975e77a168fc6   # tokenizer.model
cameras: [top, left_wrist, right_wrist]          # model input order
image_keys:                                      # role -> LeRobot feature key of the checkpoint
  top: observation.images.top
  left_wrist: observation.images.left
  right_wrist: observation.images.right
image_size: null                                 # trained on 640x360; the model letterboxes to 224x224 itself
state: [left.j1, left.j2, left.j3, left.j4, left.j5, left.j6, left.gripper,
        right.j1, right.j2, right.j3, right.j4, right.j5, right.j6, right.gripper]
# Applied only with `server.py --wire-frame station`; the default wire is #173's policy frame
# (gr00t.act adds GAP_GR00T_JOINT_OFFSET on the client). station = model + offset. The top level is
# the station twin (already in the data's frame); `--station real` merges stations.real over it,
# as policies/molmoact2-yam's profile does (roboskillhub.vla.load_profile(path, station="real")).
joint_offset_rad:
  left: [0, 0, 0, 0, 0, 0]
  right: [0, 0, 0, 0, 0, 0]
gripper: {station_open: 1.0, station_closed: 0.0, model_open: 1.0, model_closed: 0.0}   # card: [0, 1]; A2 measures
action: {type: abs_joint, dim: 14, horizon: 30, execute_steps: 25, hz: 30}
extra: {num_steps: 10, dtype: bfloat16}
stations:
  real:
    joint_offset_rad:
      left: [1.5707963, 0, 0, 0, 0, 0]
      right: [1.5707963, 0, 0, 0, 0, 0]
