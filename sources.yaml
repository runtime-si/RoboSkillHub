# What this hub federates, every entry pinned to a commit.
#
# Bundles in this repository (tools/, skills/, policies/) always shadow an
# upstream bundle of the same name. Upstream bundles are not copied here: they
# are cloned at the pinned commit by `roboskillhub sync`, and the hub metadata we add
# to them lives in their overlay file.
#
# Bump a pin in its own PR; CI re-checks every bundle against the new commit.

engine:
  name: graph-as-policy
  repo: https://github.com/graph-robots/graph-as-policy
  # The commit RoboSimStudio pins, so a bundle that checks here runs there.
  commit: "09e45f8de27bc1a29629382ed7c2b9b4b384b3d6"

sources:
  - name: open-robot-skills
    repo: https://github.com/graph-robots/open-robot-skills
    commit: "752dfbd96968d4d08379f8111765efbf6457800b"
    license: Apache-2.0
    overlay: overlays/open-robot-skills.yaml
