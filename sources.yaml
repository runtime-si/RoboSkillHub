# What this hub federates, every entry pinned to a commit.
#
# Bundles in this repository (tools/, skills/, policies/) always shadow an
# upstream bundle of the same name. A federated registry is not copied here: it
# is cloned at the pinned commit by `roboskillhub sync`, and the hub metadata we
# add to its bundles lives in its overlay file under overlays/.
#
# The open-robot-skills bundles used to be federated this way. They now live in
# this repository, converted to its format, from the commit each bundle's
# metadata.hub.provenance.code names.
#
# Bump a pin in its own PR; CI re-checks every bundle against the new commit.

engine:
  name: graph-as-policy
  repo: https://github.com/graph-robots/graph-as-policy
  # The commit RoboSimStudio pins, so a bundle that checks here runs there.
  commit: "09e45f8de27bc1a29629382ed7c2b9b4b384b3d6"

sources: []
