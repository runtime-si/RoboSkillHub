[project]
name = "{{name}}-tool-bundle"
version = "0.1.0"
readme = "SKILL.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "graph-as-policy-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Nothing ships in a wheel: gap runs the bundle in place with
# `uv run --project tools/{{name}} -- python -m gap_core.rpc.server --bundle {{name}}`.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.metadata]
allow-direct-references = true

# The engine commit sources.yaml pins, by URL, so the bundle resolves the same
# wherever its checkout sits (a dev clone, a robot's `openskills fetch`).
[tool.uv.sources]
graph-as-policy-core = { git = "https://github.com/graph-robots/graph-as-policy.git", rev = "09e45f8de27bc1a29629382ed7c2b9b4b384b3d6", subdirectory = "gap-core" }
