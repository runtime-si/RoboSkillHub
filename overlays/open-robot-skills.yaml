  notes: LIBERO observation and OSC_POSE action conventions; drives the arm through sim.apply_policy_action.
pi05-libero:
  stage: execute
  embodiments: [panda]
  tuned_on: [panda]
  tasks: [libero]
  notes: LIBERO observation and OSC_POSE action conventions; drives the arm through sim.apply_policy_action.

