# Hub metadata for the open-robot-skills bundles, at the commit sources.yaml pins.
#
# Keys are the ones a native bundle writes under metadata.hub (SPEC.md). What
# can be read off a bundle -- its exits, the tools it calls, whether it needs
# simulator ground truth (its tier) -- is derived and never written here.
#
# embodiments: [any] means the bundle reads the robot through describe_* tools
# instead of hard-coding one. It is a declaration, not a result: results are
# eval records under evals/, and they set a bundle's maturity.
# tuned_on names the robot its constants were measured on; on any other robot,
# expect to re-measure them.

# --- tools ------------------------------------------------------------------
curobo:
  stage: plan
  embodiments: [any]
  tuned_on: [panda]
  tasks: [motion-planning]
  notes: Plans for curobo's built-in franka.yml. It knows yam.yml is 6-DoF but does not ship that config; register its path in _PROJECT_ROBOT_CONFIGS before planning for yam.
curve:
  stage: perceive
  embodiments: [any]
  tasks: [cable-routing]
gemini-er:
  stage: perceive
  embodiments: [any]
geometry:
  stage: perceive
  embodiments: [any]
  tuned_on: [panda]
  notes: exclude_robot_points models the Franka Panda's links; on another arm its points are not masked.
grounding-dino:
  stage: perceive
  embodiments: [any]
molmo:
  stage: perceive
  embodiments: [any]
sam3:
  stage: perceive
  embodiments: [any]
vlm:
  stage: perceive
  embodiments: [any]

# --- policies ---------------------------------------------------------------
